  DataVolumeAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      InstanceId: !Ref Server
      VolumeId: !Ref DataVolume
      Device: /dev/sdf

  ServerAddress:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      InstanceId: !Ref Server
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-address" }]

  # ---------------------------------------------------------------- budget alert
  Budget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "polynovea-${AWS::StackName}"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: !Ref BudgetMonthlyUsd, Unit: USD }
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref BudgetEmail }]
        - Notification: { NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref BudgetEmail }]

Outputs:
  SetupAddress:
    Description: >-
      Where to open the setup wizard. With a domain, first point its A record at PublicIp; HTTPS
      starts within minutes of that.
    Value: !If
      - HasDomain
      - !Sub "https://${Domain}/setup (after the domain's A record points at ${ServerAddress})"
      - "http://localhost:3000/setup, through the SshTunnel command below"
  SetupCode:
    Description: >-
      Where to find the one-time setup code the wizard asks for. It is shown only until setup is
      finished, works once and expires after an hour. Anyone in this AWS account who can read the
      server's system log can see it during that time.
    Value: !Sub "AWS console > EC2 > Instances > select ${AWS::StackName}-server > Actions > Monitor and troubleshoot > Get system log. Look for the line with \"Setup code\" (it appears a few minutes after the server starts; refresh the log if it isn't there yet)."
  SshTunnel:
    Condition: HasAdminCidr
    Description: SSH from AdminCidr with your key pair. Without a domain this is also the route into the setup wizard.
    Value: !If
      - HasDomain
      - !Sub "ssh ubuntu@${ServerAddress}"
      - !Sub "ssh -L 3000:127.0.0.1:3000 ubuntu@${ServerAddress}"
  PublicIp:
    Description: The server's fixed public address. Point your domain's A record here.
    Value: !Ref ServerAddress
  DatabaseMode:
    Value: !Ref DatabaseMode
  DatabaseSecretArn:
    Condition: ManagedDb
    Description: Set on the server as POLYNOVEA_DB_SECRET_REF. An address, not the secret itself.
    Value: !Ref DatabaseSecret
  DatabaseEndpoint:
    Condition: ManagedDb
    Description: Private; reachable only from the Polynovea server.
    Value: !GetAtt Database.Endpoint.Address
  BucketName:
    Description: Set on the server as POLYNOVEA_BACKUP_BUCKET; the setup wizard suggests it for "On this server" backups.
    Value: !Ref Bucket
  BucketRegion:
    Value: !Ref AWS::Region
  ServerRoleArn:
    Description: The server's only identity. It can read the one database secret and use the one bucket.
    Value: !GetAtt ServerRole.Arn

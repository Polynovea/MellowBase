AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Polynovea CMS on one EC2 server in your own AWS account, with an RDS PostgreSQL 16 database
  (or PostgreSQL on the server itself), an S3 bucket, a budget alert and a narrowly scoped role.
  Expected monthly cost, estimated from AWS on-demand list prices for us-east-1 in November 2026,
  before tax, with light traffic: about US$34 with DatabaseMode=managed (t4g.small server,
  db.t4g.micro single-zone database, 2 x 20 GB disks, public IPv4, one secret) or about US$20 with
  DatabaseMode=on-this-server. Other regions and heavy traffic cost more; your AWS bill is what counts.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: "Database" }
        Parameters: [DatabaseMode, DatabaseInstanceClass, DatabaseStorageGb, PostgresVersion]
      - Label: { default: "Budget alert" }
        Parameters: [BudgetEmail, BudgetMonthlyUsd]
      - Label: { default: "How you reach the site (set a domain, or your IP address for the SSH tunnel)" }
        Parameters: [Domain, AcmeEmail, AdminCidr, KeyPairName]
      - Label: { default: "Server" }
        Parameters: [InstanceType, Architecture, DataVolumeGb]
      - Label: { default: "Names and cost tracking (the defaults suit an AWS account of its own)" }
        Parameters: [NamePrefix, ProjectTag]
      - Label: { default: "Release package (filled in by the release's link; leave as they are)" }
        Parameters: [ContainerImage, CaddyImage]
    ParameterLabels:
      DatabaseMode: { default: "Where the database runs" }
      DatabaseInstanceClass: { default: "Database size (managed only)" }
      DatabaseStorageGb: { default: "Database storage in GB (managed only)" }
      PostgresVersion: { default: "PostgreSQL 16 version (managed only; leave as it is)" }
      BudgetEmail: { default: "Email for the budget alert" }
      BudgetMonthlyUsd: { default: "Monthly budget in US dollars" }
      InstanceType: { default: "Server size" }
      Architecture: { default: "Processor type (must match the server size)" }
      DataVolumeGb: { default: "Data disk in GB" }
      Domain: { default: "Your domain for the site (optional, for example cms.example.com)" }
      AcmeEmail: { default: "Email for HTTPS certificate notices (optional)" }
      AdminCidr: { default: "Your IP address for SSH (optional, for example 203.0.113.7/32)" }
      KeyPairName: { default: "EC2 key pair for SSH (optional)" }
      NamePrefix: { default: "Name prefix (set once, when the stack is created)" }
      ProjectTag: { default: "Project tag (what the budget counts)" }
      ContainerImage: { default: "Polynovea CMS image, pinned by digest" }
      CaddyImage: { default: "HTTPS proxy (Caddy) image, pinned by digest" }

Parameters:
  DatabaseMode:
    Type: String
    Default: managed
    AllowedValues: [managed, on-this-server]
    Description: >-
      managed = an RDS PostgreSQL 16 database the setup wizard finds by itself ("Created for you").
      on-this-server = PostgreSQL on the server's data disk, backed up to the S3 bucket (cheaper, for
      trials and small sites).
  DatabaseInstanceClass:
    Type: String
    Default: db.t4g.micro
    AllowedValues: [db.t4g.micro, db.t4g.small, db.t4g.medium, db.t3.micro, db.t3.small, db.t3.medium]
  PostgresVersion:
    Type: String
    Default: "16.15"
    AllowedPattern: "^16\\.[0-9]+$"
    ConstraintDescription: A PostgreSQL 16 minor version that RDS can create, such as 16.15.
    Description: >-
      RDS no longer creates databases from the bare "16", so the template names a current 16.x
      minor. Each release bumps this default to the newest one; automatic minor upgrades keep a
      running database patched after that.
  DatabaseStorageGb:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 1000
  BudgetEmail:
    Type: String
    AllowedPattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
    ConstraintDescription: Enter an email address.
    Description: AWS emails this address when spending passes 80% of the budget, or is forecast to pass 100%.
  BudgetMonthlyUsd:
    Type: Number
    Default: 50
    MinValue: 1
  InstanceType:
    Type: String
    Default: t4g.small
    AllowedValues: [t4g.small, t4g.medium, t4g.large, t3.small, t3.medium, t3.large]
    Description: t4g sizes are arm64 (cheaper), t3 sizes are amd64. On-this-server sites with real traffic should use t4g.medium.
  Architecture:
    Type: String
    Default: arm64
    AllowedValues: [arm64, amd64]
    Description: arm64 for t4g sizes, amd64 for t3 sizes.
  DataVolumeGb:
    Type: Number
    Default: 20
    MinValue: 10
    MaxValue: 2000
    Description: The separate disk mounted at /var/lib/polynovea (settings, uploads, and the database when it runs on this server).
  Domain:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$"
    ConstraintDescription: Leave blank, or enter a lowercase domain name such as cms.example.com.
    Description: >-
      With a domain, the server gets a free HTTPS certificate (Let's Encrypt) once the domain's A record
      points at the PublicIp output, and setup is at https://<domain>/setup. Without one, ports 80 and
      443 stay closed and setup goes through the SSH tunnel, which needs AdminCidr and KeyPairName.
  AcmeEmail:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
    Description: Optional. Let's Encrypt may email this address about the certificate.
  AdminCidr:
    Type: String
    Default: ""
    AllowedPattern: "^$|^(25[0-5]|2[0-4]\\d|1?\\d?\\d)(\\.(25[0-5]|2[0-4]\\d|1?\\d?\\d)){3}/(3[0-2]|[12]?\\d)$"
    ConstraintDescription: Leave blank, or enter one IPv4 range such as 203.0.113.7/32.
    Description: >-
      Leave blank for no SSH access at all. Set it to your own address (ending /32) to allow SSH from
      that address only. Needed for the free SSH-tunnel route into the setup wizard when there is no domain.
  KeyPairName:
    Type: String
    Default: ""
    Description: An existing EC2 key pair in this region, needed only for SSH. Leave blank for none.
  # The names below start with NamePrefix: the database (<prefix>-<stack ID>) and its log group, the
  # database secret (<prefix>/<stack name>/database-admin) and the budget (<prefix>-<stack name>). The
  # default keeps the names every earlier version of this template gave. Everything else is named
  # after the stack by CloudFormation itself (the bucket, the role, the security groups), so the stack
  # name already tells installs apart.
  NamePrefix:
    Type: String
    Default: polynovea
    MinLength: 3
    MaxLength: 26
    # The strictest of its uses: an RDS identifier (a letter first; letters, digits and single hyphens;
    # no hyphen at the end; 63 characters with the 37 of "-<stack ID>").
    AllowedPattern: "^[a-z](-?[a-z0-9])*$"
    ConstraintDescription: 3 to 26 lowercase letters, digits and single hyphens, starting with a letter and not ending with a hyphen.
    Description: >-
      Leave as it is in an AWS account of its own. In a shared account, set it when the stack is created
      (for example mellowbase) and never change it afterwards: it is part of the database's name, and a
      new name would make CloudFormation replace the database, which deletion protection blocks, so the
      update fails.
  ProjectTag:
    Type: String
    Default: MellowBase
    AllowedPattern: "^[A-Za-z0-9][A-Za-z0-9_.:/=+@-]{0,62}$"
    ConstraintDescription: "1 to 63 letters, digits and _ . : / = + @ -, starting with a letter or digit."
    Description: >-
      Every resource gets the tag Project=<this value>, and the budget counts only costs with that tag.
      Activate Project as a cost allocation tag in AWS Billing first (see the README); until then the
      budget counts nothing.
  # Images come only from the release (deploy/release-images.json, baked in by
  # deploy/scripts/release-templates.mjs). The patterns stop a quick-create link from swapping in
  # anyone else's image: the CMS only from ghcr.io/polynovea/, the proxy only Caddy's official image,
  # both pinned by digest. The CMS image's signature is checked again on the server before every start.
  ContainerImage:
    Type: String
    Default: ""
    AllowedPattern: "^$|^ghcr\\.io/polynovea/[a-z0-9]+([._/-][a-z0-9]+)*@sha256:[a-f0-9]{64}$"
    ConstraintDescription: Only the Polynovea CMS image from ghcr.io/polynovea/, pinned by digest (name@sha256:...).
    Description: Set by the release. Leave as it is.
  CaddyImage:
    Type: String
    Default: ""
    AllowedPattern: "^$|^(docker\\.io/library/)?caddy@sha256:[a-f0-9]{64}$"
    ConstraintDescription: Only Caddy's official image, pinned by digest (caddy@sha256:...).
    Description: Set by the release. Leave as it is.

Rules:
  SomeWayIn:
    Assertions:
      - Assert:
          Fn::Or:
            - Fn::Not: [Fn::Equals: [!Ref Domain, ""]]
            - Fn::And:
                - Fn::Not: [Fn::Equals: [!Ref AdminCidr, ""]]
                - Fn::Not: [Fn::Equals: [!Ref KeyPairName, ""]]
        AssertDescription: >-
          Set a Domain (setup at https://<domain>/setup), or set both AdminCidr and KeyPairName (setup
          through the SSH tunnel). Without either, nobody could reach the setup wizard.
  ArchitectureMatchesServerSize:
    Assertions:
      - Assert:
          Fn::Or:
            - Fn::And:
                - Fn::Equals: [!Ref Architecture, arm64]
                - Fn::Contains: [[t4g.small, t4g.medium, t4g.large], !Ref InstanceType]
            - Fn::And:
                - Fn::Equals: [!Ref Architecture, amd64]
                - Fn::Contains: [[t3.small, t3.medium, t3.large], !Ref InstanceType]
        AssertDescription: Processor type must match the server size (arm64 for t4g, amd64 for t3).

Mappings:
  # The release's published Polynovea AMIs; "none" = not published in that region (Ubuntu is used).
  # BEGIN GENERATED release-amis
  ReleaseAmis:
    af-south-1: { arm64: none, amd64: none }
    ap-east-1: { arm64: none, amd64: none }
    ap-east-2: { arm64: none, amd64: none }
    ap-northeast-1: { arm64: none, amd64: none }
    ap-northeast-2: { arm64: none, amd64: none }
    ap-northeast-3: { arm64: none, amd64: none }
    ap-south-1: { arm64: none, amd64: none }
    ap-south-2: { arm64: none, amd64: none }
    ap-southeast-1: { arm64: none, amd64: none }
    ap-southeast-2: { arm64: none, amd64: none }
    ap-southeast-3: { arm64: none, amd64: none }
    ap-southeast-4: { arm64: none, amd64: none }
    ap-southeast-5: { arm64: none, amd64: none }
    ap-southeast-6: { arm64: none, amd64: none }
    ap-southeast-7: { arm64: none, amd64: none }
    ca-central-1: { arm64: none, amd64: none }
    ca-west-1: { arm64: none, amd64: none }
    eu-central-1: { arm64: none, amd64: none }
    eu-central-2: { arm64: none, amd64: none }
    eu-north-1: { arm64: none, amd64: none }
    eu-south-1: { arm64: none, amd64: none }
    eu-south-2: { arm64: none, amd64: none }
    eu-west-1: { arm64: none, amd64: none }
    eu-west-2: { arm64: none, amd64: none }
    eu-west-3: { arm64: none, amd64: none }
    il-central-1: { arm64: none, amd64: none }
    me-central-1: { arm64: none, amd64: none }
    me-south-1: { arm64: none, amd64: none }
    mx-central-1: { arm64: none, amd64: none }
    sa-east-1: { arm64: none, amd64: none }
    us-east-1: { arm64: none, amd64: none }
    us-east-2: { arm64: none, amd64: none }
    us-west-1: { arm64: none, amd64: none }
    us-west-2: { arm64: none, amd64: none }
  # END GENERATED release-amis

Conditions:
  ManagedDb: !Equals [!Ref DatabaseMode, managed]
  HasAdminCidr: !Not [!Equals [!Ref AdminCidr, ""]]
  HasKeyPair: !Not [!Equals [!Ref KeyPairName, ""]]
  # The release's Polynovea AMI for this region and processor, if it published one.
  HasReleaseAmi: !Not [!Equals [!FindInMap [ReleaseAmis, !Ref AWS::Region, !Ref Architecture], none]]
  HasDomain: !Not [!Equals [!Ref Domain, ""]]
  HasAcmeEmail: !Not [!Equals [!Ref AcmeEmail, ""]]
  HasContainerImage: !Not [!Equals [!Ref ContainerImage, ""]]
  HasCaddyImage: !Not [!Equals [!Ref CaddyImage, ""]]

Resources:
  # ---------------------------------------------------------------- network (no NAT gateway: free)
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-vpc" }, { Key: Project, Value: !Ref ProjectTag }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-igw" }, { Key: Project, Value: !Ref ProjectTag }]

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  ServerSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-server" }, { Key: Project, Value: !Ref ProjectTag }]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-public" }, { Key: Project, Value: !Ref ProjectTag }]

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  ServerSubnetRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref ServerSubnet
      RouteTableId: !Ref PublicRouteTable

  # The database subnets have no route to the internet at all.
  DatabaseRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: ManagedDb
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-database" }, { Key: Project, Value: !Ref ProjectTag }]

  DatabaseSubnetA:
    Type: AWS::EC2::Subnet
    Condition: ManagedDb
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.10.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-database-a" }, { Key: Project, Value: !Ref ProjectTag }]

  DatabaseSubnetB:
    Type: AWS::EC2::Subnet
    Condition: ManagedDb
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.11.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-database-b" }, { Key: Project, Value: !Ref ProjectTag }]

  DatabaseSubnetARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: ManagedDb
    Properties:
      SubnetId: !Ref DatabaseSubnetA
      RouteTableId: !Ref DatabaseRouteTable

  DatabaseSubnetBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: ManagedDb
    Properties:
      SubnetId: !Ref DatabaseSubnetB
      RouteTableId: !Ref DatabaseRouteTable

  # ---------------------------------------------------------------- security groups
  ServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Polynovea server - web in only with a domain, SSH only from AdminCidr, out to HTTPS, HTTP and the database
      VpcId: !Ref Vpc
      # Without a domain nothing answers on 80/443 (the CMS listens on 127.0.0.1 only), so they stay closed.
      SecurityGroupIngress:
        - !If
          - HasDomain
          - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: "HTTP: Let's Encrypt validation and redirect to HTTPS (Caddy)" }
          - !Ref AWS::NoValue
        - !If
          - HasDomain
          - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: "Website (HTTPS, Caddy)" }
          - !Ref AWS::NoValue
        - !If
          - HasAdminCidr
          - { IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: !Ref AdminCidr, Description: "SSH from the owner's address only" }
          - !Ref AWS::NoValue
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: "HTTPS: AWS APIs, image registry, updates" }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: "Ubuntu package mirrors" }
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-server" }, { Key: Project, Value: !Ref ProjectTag }]

  ServerToDatabaseEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: ManagedDb
    Properties:
      GroupId: !Ref ServerSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      DestinationSecurityGroupId: !Ref DatabaseSecurityGroup
      Description: PostgreSQL to the database only

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: ManagedDb
    Properties:
      GroupDescription: Polynovea database - reachable only from the Polynovea server
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref ServerSecurityGroup, Description: "PostgreSQL from the Polynovea server only" }
      # A rule to an unused loopback address replaces AWS's default allow-all egress: the database starts no connections.
      SecurityGroupEgress:
        - { IpProtocol: "-1", CidrIp: 127.0.0.1/32, Description: "No outbound traffic" }
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-database" }, { Key: Project, Value: !Ref ProjectTag }]

  # ---------------------------------------------------------------- database ("Created for you")
  # Not the RDS-managed master password: that secret holds only username and password, and RDS
  # forbids adding fields. The setup wizard also needs host and port, so this stack owns the secret,
  # AWS generates the password inside it, RDS reads it by dynamic reference, and the attachment below
  # adds host, port and engine (the shape of an RDS secret attached to its instance).
  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Condition: ManagedDb
    # Kept if the stack is deleted or the secret replaced: the database's final snapshot is useless
    # without its admin login.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub "${NamePrefix}/${AWS::StackName}/database-admin"
      Description: Polynovea database admin login. Read once by the setup wizard through the server's role.
      Tags: [{ Key: Project, Value: !Ref ProjectTag }]
      GenerateSecretString:
        SecretStringTemplate: '{"username":"polynovea_admin","dbname":"polynovea","port":5432}'
        GenerateStringKey: password
        PasswordLength: 40
        ExcludePunctuation: true
        ExcludeCharacters: "\"@/\\'"
        IncludeSpace: false
        RequireEachIncludedType: true

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Condition: ManagedDb
    Properties:
      DBSubnetGroupDescription: Polynovea database subnets (no internet route)
      SubnetIds: [!Ref DatabaseSubnetA, !Ref DatabaseSubnetB]
      Tags: [{ Key: Project, Value: !Ref ProjectTag }]

  # The database's own log (errors, slow autovacuum, checkpoints) goes to CloudWatch, kept 14 days, so
  # it survives the instance and support can read it. Made here, before RDS would make it with no
  # expiry, so the database has a fixed lowercase name: <NamePrefix>-<this stack's ID>, by default
  # polynovea-<this stack's ID> as in every earlier version of this template.
  # That name is fixed when the stack is created and must never change in a later template version or
  # stack update: a new name makes CloudFormation replace the database, which deletion protection then
  # blocks.
  DatabaseLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: ManagedDb
    Properties:
      LogGroupName: !Join ["", ["/aws/rds/instance/", !Ref NamePrefix, "-", !Select [2, !Split ["/", !Ref "AWS::StackId"]], "/postgresql"]]
      RetentionInDays: 14
      Tags: [{ Key: Project, Value: !Ref ProjectTag }]

  Database:
    Type: AWS::RDS::DBInstance
    Condition: ManagedDb
    DependsOn: DatabaseLogGroup
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Join ["", [!Ref NamePrefix, "-", !Select [2, !Split ["/", !Ref "AWS::StackId"]]]]
      Engine: postgres
      EngineVersion: !Ref PostgresVersion
      AutoMinorVersionUpgrade: true
      DBInstanceClass: !Ref DatabaseInstanceClass
      DBName: polynovea
      MasterUsername: !Sub "{{resolve:secretsmanager:${DatabaseSecret}:SecretString:username}}"
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DatabaseSecret}:SecretString:password}}"
      AllocatedStorage: !Ref DatabaseStorageGb
      MaxAllocatedStorage: 200
      StorageType: gp3
      StorageEncrypted: true
      MultiAZ: false
      PubliclyAccessible: false
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
      BackupRetentionPeriod: 7
      PreferredBackupWindow: "03:00-04:00"
      DeletionProtection: true
      CopyTagsToSnapshot: true
      EnableCloudwatchLogsExports: [postgresql]
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-database" }, { Key: Project, Value: !Ref ProjectTag }]

  DatabaseSecretAttachment:
    Type: AWS::SecretsManager::SecretTargetAttachment
    Condition: ManagedDb
    Properties:
      SecretId: !Ref DatabaseSecret
      TargetId: !Ref Database
      TargetType: AWS::RDS::DBInstance

  # ---------------------------------------------------------------- bucket
  Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - Id: keep-deleted-backups-14-days
            Status: Enabled
            NoncurrentVersionExpiration: { NoncurrentDays: 14 }
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 7 }
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-bucket" }, { Key: Project, Value: !Ref ProjectTag }]

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: HttpsOnly
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt Bucket.Arn, !Sub "${Bucket.Arn}/*"]
            Condition: { Bool: { "aws:SecureTransport": "false" } }

  # ---------------------------------------------------------------- server identity: one secret, one bucket
  ServerRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Polynovea server - reads the one database secret and uses the one bucket. Nothing else.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: one-bucket
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ListTheBucket
                Effect: Allow
                Action: [s3:ListBucket, s3:GetBucketLocation]
                Resource: !GetAtt Bucket.Arn
              - Sid: ReadWriteTheBucket
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub "${Bucket.Arn}/*"
        - !If
          - ManagedDb
          - PolicyName: one-secret
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Sid: ReadTheDatabaseSecret
                  Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref DatabaseSecret
          - !Ref AWS::NoValue
      Tags: [{ Key: Project, Value: !Ref ProjectTag }]

  ServerInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref ServerRole]

  # ---------------------------------------------------------------- server
  # A separate encrypted disk for /var/lib/polynovea. It survives the server being replaced, and a
  # final snapshot is taken if the stack is deleted.
  DataVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      AvailabilityZone: !GetAtt ServerSubnet.AvailabilityZone
      Size: !Ref DataVolumeGb
      VolumeType: gp3
      Encrypted: true
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-data" }, { Key: Project, Value: !Ref ProjectTag }]

  ServerLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      TagSpecifications:
        - ResourceType: launch-template
          Tags: [{ Key: Project, Value: !Ref ProjectTag }]
      LaunchTemplateData:
        # EC2 makes the root disk at launch, outside the stack, so the disk takes its tags from here.
        TagSpecifications:
          - ResourceType: volume
            Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-root" }, { Key: Project, Value: !Ref ProjectTag }]
        # IMDSv2 tokens are always required. Hop limit 2, not 1: the release package's bridged
        # container profile runs pgBackRest inside a container, one network hop from the instance,
        # and it needs the instance role from IMDS to reach the bucket.
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
          HttpPutResponseHopLimit: 2
          InstanceMetadataTags: disabled
        BlockDeviceMappings:
          - DeviceName: /dev/sda1
            Ebs: { VolumeSize: 20, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true }

  Server:
    Type: AWS::EC2::Instance
    DependsOn: PublicDefaultRoute
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref ServerLaunchTemplate
        Version: !GetAtt ServerLaunchTemplate.LatestVersionNumber
      # The release's AMI for this region, or else Ubuntu 24.04 from Canonical's public parameter. No
      # parameter can name another image.
      ImageId: !If
        - HasReleaseAmi
        - !FindInMap [ReleaseAmis, !Ref AWS::Region, !Ref Architecture]
        - !Sub "{{resolve:ssm:/aws/service/canonical/ubuntu/server/24.04/stable/current/${Architecture}/hvm/ebs-gp3/ami-id}}"
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref ServerInstanceProfile
      KeyName: !If [HasKeyPair, !Ref KeyPairName, !Ref AWS::NoValue]
      EbsOptimized: true
      Monitoring: false
      NetworkInterfaces:
        - DeviceIndex: "0"
          SubnetId: !Ref ServerSubnet
          GroupSet: [!Ref ServerSecurityGroup]
          AssociatePublicIpAddress: false
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-server" }, { Key: Project, Value: !Ref ProjectTag }]
      # User data is readable through the metadata service and copied to disk by cloud-init, so it
      # holds no secrets: only the secret's ARN, the bucket's name, the region, the domain and the
      # image digests. The release package's own files do the rest (see the generated block).
      UserData:

# Checkov settings for bash deploy/scripts/validate.sh. Every skipped check is a deliberate trade-off,
# labelled "paid extra" (see "Paid hardening upgrades" in deploy/README.md) or "by design"
# for a small, cheap, single-server install (the brief: single zone, small sizes, expected cost shown
# in each template). The security properties the templates promise (IMDSv2, private database,
# encryption at rest, deletion protection, one secret + one bucket, no secrets in user data) are NOT
# skipped, and deploy/templates.test.ts checks them as well.
compact: true
quiet: true
skip-check:
  - CKV_AWS_157   # paid extra: RDS Multi-AZ: the brief says single zone (doubles the database cost)
  - CKV_AZURE_136 # paid extra: Flexible Server geo-redundant backups: extra cost; 7-day local backups kept
  - CKV_AWS_144   # paid extra: S3 cross-region replication: doubles storage cost
  - CKV_AZURE_206 # paid extra: Storage replication beyond LRS: extra cost
  - CKV2_AZURE_32 # paid extra: Key Vault private endpoint: about US$7/month; firewall admits only the VM subnet
  - CKV2_AZURE_33 # paid extra: Storage private endpoint: about US$7/month; firewall admits only the VM subnet
  - CKV2_AZURE_57 # paid extra: Flexible Server private endpoint: it already has no public access (VNet-integrated, delegated subnet)
  - CKV_AZURE_59  # paid extra: Storage "public network access" off needs a private endpoint; default-deny firewall used instead
  - CKV_AWS_126   # paid extra: EC2 detailed monitoring: paid; the CMS's System page monitors the server
  - CKV_AWS_118   # paid extra: RDS enhanced monitoring: paid, needs another role
  - CKV_AWS_353   # paid extra: RDS Performance Insights: not needed for a small site
  - CKV2_AWS_11   # paid extra: VPC flow logs: CloudWatch ingestion cost
  - CKV2_AWS_30   # paid extra: RDS query logging: cost and noise
  - CKV_AWS_158   # paid extra: CloudWatch log group CMK: the database log is encrypted with CloudWatch's own key
  - CKV_AWS_338   # by design: Log retention under a year: the database log is kept 14 days, for support, at a few cents a month
  - CKV_AWS_18    # paid extra: S3 access logging: needs a second bucket
  - CKV2_AWS_62   # paid extra: S3 event notifications: nothing consumes them
  - CKV_AZURE_33  # paid extra: Storage Queue logging: the account has no queues
  - CKV2_AZURE_21 # paid extra: Blob read logging: cost and noise
  - CKV_AWS_149   # paid extra: Secrets Manager CMK: AWS-managed key; a CMK costs US$1/month and widens the role
  - CKV_AWS_189   # paid extra: EBS CMK: AWS-managed key, encrypted
  - CKV_AWS_145   # paid extra: S3 KMS: SSE-S3 (AES-256) encryption, no KMS request costs
  - CKV2_AZURE_1  # paid extra: Storage CMK: Microsoft-managed keys plus infrastructure encryption
  - CKV_AZURE_93  # paid extra: Managed disk CMK (disk encryption set): Microsoft-managed keys
  - CKV_AZURE_2   # paid extra: Managed disk encryption setting: disks are encrypted at rest with platform keys by default; the check wants a disk encryption set (CMK)
  - CKV_AZURE_189 # paid extra: Key Vault public network access off needs a private endpoint; default-deny firewall admits only the VM subnet
  - CKV_AWS_260   # by design: Port 80 open: only when a domain is set, for Let's Encrypt HTTP-01 and the HTTPS redirect
  - CKV_AZURE_119 # by design: NIC public IP: the site is served from this VM
  - CKV_AWS_161   # by design: RDS IAM auth: the CMS uses password roles (polynovea_owner / polynovea_app) made by the wizard
  - CKV2_AWS_57   # by design: Secret rotation: the admin login is read once by the wizard, then unused
  - CKV_AZURE_41  # by design: Key Vault secret expiry: an expired secret can't be read, which would break re-running setup
  - CKV_AZURE_97  # by design: Encryption at host needs a per-subscription feature registration, which would break the one-click deploy; disks are still encrypted at rest
  - CKV_AZURE_151 # by design: false positive, a Windows-only check flagged on this Linux VM
  - CKV_AWS_23    # by design: false positive, every security group rule has a Description; checkov can't read the conditional (Fn::If) ones
  - CKV_AZURE_36  # by design: Storage "trusted Microsoft services" bypass is off: no Azure service needs the account (the VM uses its subnet; the container is made through Resource Manager)
  - CKV_AZURE_43  # by design: Storage account naming: false positive, the name is computed (prefix + hash, 3-24 lowercase)

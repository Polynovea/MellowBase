# Minimal stand-in for Supabase's API gateway: supabase-js calls <url>/rest/v1/... and <url>/auth/v1/...
# The upstreams are resolved per request through Docker's DNS, so a container restart does not leave
# the gateway pointing at a stale address. Like Supabase's Kong gateway, it answers CORS itself
# (GoTrue rejects supabase-js's x-client-info preflight on its own), but only for the local app
# origins used in development and browser tests.
#
# All headers are set once at server level, from maps: nginx drops inherited add_header lines in any
# block that declares its own, so locations only route.

map $http_origin $cors_origin {
  default "";
  "http://127.0.0.1:3100" $http_origin;
  "http://localhost:3000" $http_origin;
  "http://127.0.0.1:3000" $http_origin;
}

map $request_method $cors_methods {
  default "";
  OPTIONS "GET, POST, PATCH, PUT, DELETE, OPTIONS";
}

map $request_method $cors_headers {
  default "";
  OPTIONS "apikey, authorization, content-type, prefer, range, x-client-info, x-supabase-api-version, accept-profile, content-profile";
}

map $request_method $cors_max_age {
  default "";
  OPTIONS "600";
}

server {
  listen 80;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $postgrest http://postgrest:3000;
  set $gotrue http://gotrue:9999;

  proxy_hide_header Access-Control-Allow-Origin;
  proxy_hide_header Access-Control-Allow-Credentials;
  proxy_hide_header Access-Control-Allow-Headers;
  proxy_hide_header Access-Control-Allow-Methods;
  add_header Access-Control-Allow-Origin $cors_origin always;
  add_header Access-Control-Allow-Methods $cors_methods always;
  add_header Access-Control-Allow-Headers $cors_headers always;
  add_header Access-Control-Max-Age $cors_max_age always;
  add_header Vary Origin always;

  location /rest/v1/ {
    if ($request_method = OPTIONS) {
      return 204;
    }
    rewrite ^/rest/v1/(.*)$ /$1 break;
    # Fixed upstream from this file, not request input; dev-only gateway bound to 127.0.0.1.
    proxy_pass $postgrest; # nosemgrep: generic.nginx.security.missing-internal.missing-internal
    proxy_set_header Host $host;
    proxy_http_version 1.1;
  }

  location /auth/v1/ {
    if ($request_method = OPTIONS) {
      return 204;
    }
    rewrite ^/auth/v1/(.*)$ /$1 break;
    # Fixed upstream from this file, not request input; dev-only gateway bound to 127.0.0.1.
    proxy_pass $gotrue; # nosemgrep: generic.nginx.security.missing-internal.missing-internal
    proxy_set_header Host $host;
    proxy_http_version 1.1;
  }

  location / {
    return 404;
  }
}

# Local test stack.
#
#   plain-pg      Plain PostgreSQL (15, 16 or 17; 16 by default): the CMS's database. Its superuser is
#                 polynovea_admin, used only by setup.mjs to create the roles (like the one-time admin
#                 login in the installer); migrations and tests run as the non-superuser roles.
#   azurite       Azure Blob emulator for the Azure Blob storage adapter tests (in-memory, account key
#                 generated per checkout).
#
# Supabase compatibility (profile "supabase", started only with --with-supabase): existing Supabase
# installs still upgrade with the same migrations, and the built-in auth imports GoTrue users.
#
#   supabase-db   Supabase's PostgreSQL image (roles anon/authenticated/service_role, auth schema).
#   postgrest     PostgREST over supabase-db.
#   gotrue        Supabase Auth (GoTrue) over supabase-db, the source of the GoTrue user migration.
#   rest-gateway  Serves PostgREST under /rest/v1 and GoTrue under /auth/v1 like Supabase's gateway.
#
# Everything binds to 127.0.0.1 only. Passwords and the JWT secret come from .env.test.local,
# which `node scripts/dev-db/setup.mjs` generates (it is gitignored). Never reuse them anywhere.
#
# Each checkout (worktree) gets its own stack: setup.mjs runs this file as Compose project
# `polynovea-dev-<id>` with ports derived from the checkout's path, and records both in
# .env.test.local. Two sessions in different worktrees therefore never reset or restart each other's
# databases mid-test. Always go through setup.mjs:
#
#   node scripts/dev-db/setup.mjs                    # start PostgreSQL 16 and Azurite, migrate, grant
#   node scripts/dev-db/setup.mjs --pg=15            # the same on PostgreSQL 15 (or --pg=17)
#   node scripts/dev-db/setup.mjs --with-supabase    # also the Supabase compatibility services
#   node scripts/dev-db/setup.mjs --reset            # also drop this checkout's volumes first
#   node scripts/dev-db/setup.mjs --down             # stop this checkout's stack and drop its volumes
#
# Ports (recorded in .env.test.local): POLYNOVEA_DEV_PLAIN_PORT (plain PostgreSQL),
# POLYNOVEA_DEV_SUPABASE_PORT (Supabase PostgreSQL), POLYNOVEA_DEV_GATEWAY_PORT (REST and Auth
# gateway), POLYNOVEA_DEV_AZURITE_PORT (Azurite blob). Set POLYNOVEA_DEV_PORT_BASE before the first
# setup to choose them yourself.


services:
  plain-pg:
    image: postgres:${POLYNOVEA_DEV_PG_VERSION:-16}-alpine
    environment:
      POSTGRES_USER: polynovea_admin
      POSTGRES_PASSWORD: ${POLYNOVEA_DEV_ADMIN_PASSWORD:?run scripts/dev-db/setup.mjs}
      POSTGRES_DB: polynovea
    ports:
      - "127.0.0.1:${POLYNOVEA_DEV_PLAIN_PORT:?run scripts/dev-db/setup.mjs}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polynovea_admin -d polynovea"]
      interval: 2s
      timeout: 3s
      retries: 30

  supabase-db:
    profiles: ["supabase"]
    image: supabase/postgres:15.8.1.085
    environment:
      POSTGRES_PASSWORD: ${POLYNOVEA_DEV_SUPABASE_DB_PASSWORD:?run scripts/dev-db/setup.mjs}
      JWT_SECRET: ${POLYNOVEA_DEV_JWT_SECRET:?run scripts/dev-db/setup.mjs}
    ports:
      - "127.0.0.1:${POLYNOVEA_DEV_SUPABASE_PORT:?run scripts/dev-db/setup.mjs}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h localhost"]
      interval: 2s
      timeout: 3s
      retries: 60

  postgrest:
    profiles: ["supabase"]
    image: postgrest/postgrest:v12.2.12
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POLYNOVEA_DEV_SUPABASE_DB_PASSWORD}@supabase-db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${POLYNOVEA_DEV_JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_DB_MAX_ROWS: "1000"
    restart: on-failure

  gotrue:
    profiles: ["supabase"]
    image: supabase/gotrue:v2.186.0
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: http://127.0.0.1:${POLYNOVEA_DEV_GATEWAY_PORT:?run scripts/dev-db/setup.mjs}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POLYNOVEA_DEV_SUPABASE_DB_PASSWORD}@supabase-db:5432/postgres
      GOTRUE_SITE_URL: http://127.0.0.1:3100
      GOTRUE_JWT_SECRET: ${POLYNOVEA_DEV_JWT_SECRET}
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
    restart: on-failure

  rest-gateway:
    profiles: ["supabase"]
    image: nginx:1.27-alpine
    depends_on:
      - postgrest
      - gotrue
    ports:
      - "127.0.0.1:${POLYNOVEA_DEV_GATEWAY_PORT:?run scripts/dev-db/setup.mjs}:80"
    volumes:
      - ./rest-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    restart: on-failure

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.34.0
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--blobPort", "10000", "--inMemoryPersistence", "--skipApiVersionCheck", "--loose"]
    environment:
      AZURITE_ACCOUNTS: polynoveadev:${POLYNOVEA_DEV_AZURITE_KEY:?run scripts/dev-db/setup.mjs}
    ports:
      - "127.0.0.1:${POLYNOVEA_DEV_AZURITE_PORT:?run scripts/dev-db/setup.mjs}:10000"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 10000"]
      interval: 2s
      timeout: 3s
      retries: 30

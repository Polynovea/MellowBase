# Local databases for the dual-backend tests (phase 0 of the self-hosted upgrade).
#
#   plain-pg      PostgreSQL 16 with no Supabase services: the "postgres" backend. Its superuser is
#                 polynovea_admin, used only by setup.mjs to create the roles (like the one-time admin
#                 login in the installer); migrations and tests run as the non-superuser roles.
#   supabase-db   Supabase's PostgreSQL image (roles anon/authenticated/service_role, auth schema).
#   postgrest     PostgREST over supabase-db, the same API supabase-js talks to.
#   gotrue        Supabase Auth (GoTrue) over supabase-db, for browser tests of today's sign-in.
#   rest-gateway  Serves PostgREST under /rest/v1 and GoTrue under /auth/v1 like Supabase's gateway.
#
# Everything binds to 127.0.0.1 only. Passwords and the JWT secret come from .env.test.local,
# which `node scripts/dev-db/setup.mjs` generates (it is gitignored). Never reuse them anywhere.
#
#   node scripts/dev-db/setup.mjs            # start, migrate, grant, write .env.test.local
#   docker compose -f scripts/dev-db/compose.yml --env-file .env.test.local down -v
#
# Ports: 25432 (plain PostgreSQL 16), 25433 (Supabase PostgreSQL), 25480 (Supabase REST gateway).
# Set POLYNOVEA_DEV_PG_IMAGE=postgres:15-alpine or postgres:17-alpine to test another major version.
name: polynovea-dev-db

services:
  plain-pg:
    image: ${POLYNOVEA_DEV_PG_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: polynovea_admin
      POSTGRES_PASSWORD: ${POLYNOVEA_DEV_ADMIN_PASSWORD:?run scripts/dev-db/setup.mjs}
      POSTGRES_DB: polynovea
    ports:
      - "127.0.0.1:25432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polynovea_admin -d polynovea"]
      interval: 2s
      timeout: 3s
      retries: 30

  supabase-db:
    image: supabase/postgres:15.8.1.085
    environment:
      POSTGRES_PASSWORD: ${POLYNOVEA_DEV_SUPABASE_DB_PASSWORD:?run scripts/dev-db/setup.mjs}
      JWT_SECRET: ${POLYNOVEA_DEV_JWT_SECRET:?run scripts/dev-db/setup.mjs}
    ports:
      - "127.0.0.1:25433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h localhost"]
      interval: 2s
      timeout: 3s
      retries: 60

  postgrest:
    image: postgrest/postgrest:v12.2.12
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POLYNOVEA_DEV_SUPABASE_DB_PASSWORD}@supabase-db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${POLYNOVEA_DEV_JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_DB_MAX_ROWS: "1000"
    restart: on-failure

  gotrue:
    image: supabase/gotrue:v2.186.0
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: http://127.0.0.1:25480/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POLYNOVEA_DEV_SUPABASE_DB_PASSWORD}@supabase-db:5432/postgres
      GOTRUE_SITE_URL: http://127.0.0.1:3100
      GOTRUE_JWT_SECRET: ${POLYNOVEA_DEV_JWT_SECRET}
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
    restart: on-failure

  rest-gateway:
    image: nginx:1.27-alpine
    depends_on:
      - postgrest
      - gotrue
    ports:
      - "127.0.0.1:25480:80"
    volumes:
      - ./rest-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    restart: on-failure
